[build]
  publish = "."

# Old page addresses -> new pages
[[redirects]]
  from = "/capabilities*"
  to = "/how-it-works.html"
  status = 301
[[redirects]]
  from = "/solutions*"
  to = "/work-with-us.html"
  status = 301
[[redirects]]
  from = "/technology*"
  to = "/how-it-works.html"
  status = 301
[[redirects]]
  from = "/company*"
  to = "/about.html"
  status = 301
[[redirects]]
  from = "/careers*"
  to = "/about.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
# Stylesheets and scripts: always check for a newer copy so updates show immediately
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
# Images: cache for a day
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
