[build]
  publish = "."

# Old page addresses -> new pages
[[redirects]]
  from = "/capabilities*"
  to = "/how-it-works.html"
  status = 301
[[redirects]]
  from = "/solutions*"
  to = "/work-with-us.html"
  status = 301
[[redirects]]
  from = "/technology*"
  to = "/how-it-works.html"
  status = 301
[[redirects]]
  from = "/company*"
  to = "/about.html"
  status = 301
[[redirects]]
  from = "/careers*"
  to = "/about.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
